<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milano Planning Hub</title>
<style>
:root{
  --bg:#0f1418; --panel:#171e24; --panel2:#1d262d; --line:#2b3640; --text:#e6edf3; --muted:#8fa0ad;
  --accent:#ffb454; --accent2:#4cc9f0; --bad:#ff6b6b; --ok:#7bd88f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:300px 1fr 340px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
#banner{flex:1;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:#1a1200;background:var(--accent);border-color:var(--accent);font-weight:600}
aside{background:var(--panel);overflow:auto;padding:12px 14px}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;font-weight:600}
h2:first-child{margin-top:0}
select,button,input[type=range]{width:100%}
select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer} button:hover{border-color:var(--accent2)} button.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:6px;margin:4px 0;align-items:center;flex-wrap:wrap} .row>*{flex:1 1 40%}
.sl{display:grid;grid-template-columns:100px 1fr 38px;gap:6px;align-items:center;margin:3px 0}
.sl span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent2)}
label.chk{display:flex;gap:6px;align-items:center;margin:2px 0;color:var(--text)}
label.chk i{width:10px;height:10px;border-radius:50%;display:inline-block}
#stage{position:relative;overflow:hidden;background:#0b1013}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab} canvas:active{cursor:grabbing}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(15,20,24,.88);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:190px}
#bar{height:10px;border-radius:3px;margin:4px 0}
#tip{position:absolute;pointer-events:none;background:rgba(15,20,24,.95);border:1px solid var(--line);padding:5px 8px;border-radius:5px;display:none;font-size:12px;white-space:pre}
table{width:100%;border-collapse:collapse} td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px}
tr.lot{cursor:pointer} tr.lot:hover,tr.lot.sel{background:var(--panel2)}
.kv td:first-child{color:var(--muted);width:55%} .kv td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px} .small{font-size:11px}
details{margin:6px 0} summary{cursor:pointer;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
@media (max-width:1000px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto auto}header{grid-column:1}aside{max-height:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Milano Planning Hub</h1>
    <div id="banner"></div>
  </header>

  <aside id="left">
    <h2>Livello mappa</h2>
    <select id="layer"></select>
    <h2>Idoneità: pesi dei criteri</h2>
    <div class="row" id="presets"></div>
    <div id="sliders"></div>
    <div class="note small" id="wnote"></div>
    <label class="chk"><input type="checkbox" id="useConstr" checked> Escludi celle con vincoli</label>
    <div class="sl"><span>Evidenzia top</span><input type="range" id="topq" min="0" max="50" value="10"><span id="topqv">10%</span></div>
    <label class="chk"><input type="checkbox" id="showPareto"> Mostra celle Pareto-ottimali</label>
    <h2>Vista</h2>
    <div class="row"><button id="b2d" class="on">2D</button><button id="b3d">3D</button></div>
    <div class="sl"><span>Inclinazione</span><input type="range" id="tilt" min="0" max="75" value="0"><span id="tiltv">0°</span></div>
    <div class="sl"><span>Altezza</span><input type="range" id="zscale" min="0" max="100" value="40"><span id="zv">40</span></div>
    <button id="reset">Ricentra</button>
    <h2>Strati</h2>
    <div id="layers"></div>
  </aside>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="legend"><div id="ltitle"></div><div id="bar"></div><div class="row small mono"><span id="lmin"></span><span id="lmax" style="text-align:right"></span></div><div id="lcat" class="small"></div></div>
    <div id="tip"></div>
  </div>

  <aside id="right">
    <h2>Cella selezionata</h2>
    <div id="insp" class="note">Clicca una cella o un lotto.</div>
    <h2>Lotti candidati (classifica con i pesi correnti)</h2>
    <div class="note small" id="lotnote"></div>
    <table id="lots"><thead><tr><th>#</th><th>Lotto</th><th>m²</th><th>Punt.</th><th>Rob.</th></tr></thead><tbody></tbody></table>
    <h2>Analisi statistica</h2>
    <div id="stats"></div>
    <h2>Provenienza e avvisi</h2>
    <div id="prov"></div>
  </aside>
</div>
<script>document.write('<script src="'+(location.search.indexOf("test")>=0?"data_test.js":"data.js")+'"><\/script>');</script>
<script>
(function(){
const D = window.PIPELINE_DATA;
const $ = id => document.getElementById(id);
if(!D){ document.body.innerHTML = '<p style="padding:24px">Dati non trovati. Esegui <code>python run_pipeline.py</code> (oppure <code>--fixture</code> e apri <code>index.html?test</code>) e riapri questa pagina.</p>'; return; }

// ---------- stato
const CRIT = D.criteri;
const CRIT_LABEL = {need:'Bisogno', access:'Accessibilità', transform:'Trasformabilità', feasib:'Fattibilità'};
const W = {}; CRIT.forEach(c => W[c] = 0.25);
const st = {layer:'s_live', tilt:0, z:40, sel:null, selLot:null, scale:1, ox:0, oy:0, show:{boundary:true, roads:true, lots:true, poi:{}}, topq:0.10, pareto:false, useConstr:true, hover:null};
const NUM = {};   // colonne numeriche disponibili per cella
const PCOLS = new Set(); D.cells.forEach(c => Object.keys(c.p).forEach(k => PCOLS.add(k)));

// ---------- geometria: proiezione locale
let lon0=0, lat0=0, minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
const allPts = []; D.cells.forEach(c => c.r.forEach(p => allPts.push(p)));
lon0 = allPts.reduce((a,p)=>a+p[0],0)/allPts.length; lat0 = allPts.reduce((a,p)=>a+p[1],0)/allPts.length;
const KX = 111320*Math.cos(lat0*Math.PI/180), KY = 111320;
const proj = p => [(p[0]-lon0)*KX, (p[1]-lat0)*KY];
D.cells.forEach(c => { c.m = c.r.map(proj); c.cx = c.m.reduce((a,p)=>a+p[0],0)/c.m.length; c.cy = c.m.reduce((a,p)=>a+p[1],0)/c.m.length;
  c.m.forEach(p=>{minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);});
  let a=0; for(let i=0;i<c.m.length-1;i++) a+=c.m[i][0]*c.m[i+1][1]-c.m[i+1][0]*c.m[i][1]; c.ccw = a>0; });
D.lots.forEach(l => { l.m = l.r.map(r => r.map(proj)); l.cx = l.m[0].reduce((a,p)=>a+p[0],0)/l.m[0].length; l.cy = l.m[0].reduce((a,p)=>a+p[1],0)/l.m[0].length; });
const bnd = D.boundary.map(r => r.map(proj));
const roads = D.roads.map(r => r.map(proj));
const pois = {}; Object.entries(D.pois).forEach(([k,v]) => pois[k] = v.map(proj));
const POI_COL = {metro:'#ff6b6b',scuola:'#7bd88f',asilo:'#c3f0ca',sanita:'#f78fb3',farmacia:'#b197fc',verde:'#51cf66',commercio:'#ffd43b'};
Object.keys(pois).forEach(k => st.show.poi[k] = false);

// ---------- colori
const RAMP = ['#2c3e75','#2a7ab0','#2fb4a5','#a6d96a','#f6e05e','#f4a259','#d1495b'];
function ramp(t){ t=Math.max(0,Math.min(1,t)); const x=t*(RAMP.length-1), i=Math.min(RAMP.length-2,Math.floor(x)), f=x-i; return mix(RAMP[i],RAMP[i+1],f); }
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,f){const A=hex(a),B=hex(b);return `rgb(${Math.round(A[0]+(B[0]-A[0])*f)},${Math.round(A[1]+(B[1]-A[1])*f)},${Math.round(A[2]+(B[2]-A[2])*f)})`;}
const CAT = ['#e69f00','#56b4e9','#009e73','#f0e442','#0072b2','#d55e00','#cc79a7','#999999'];   // Okabe-Ito

// ---------- punteggio live
function renorm(){ const s = CRIT.reduce((a,c)=>a+W[c],0) || 1; const o={}; CRIT.forEach(c=>o[c]=W[c]/s); return o; }
function liveScore(p, w){ let s=0; for(const c of CRIT){ const v=p['crit_'+c]; s += (v==null?0:v)*w[c]; } return s; }
let LIVE = {};
function recompute(){
  const w = renorm(); LIVE = {};
  D.cells.forEach(c => { const ok = !st.useConstr || c.p.valido!==0; c.live = ok ? liveScore(c.p,w) : 0; c.ok = ok; });
  const vals = D.cells.filter(c=>c.ok).map(c=>c.live).sort((a,b)=>a-b);
  st.thr = vals.length ? vals[Math.min(vals.length-1, Math.floor(vals.length*(1-st.topq)))] : 1;
  D.lots.forEach(l => { const ok = (l.p.quota_vincolata||0) < 0.5 || !st.useConstr; l.live = ok ? liveScore(l.p,w) : 0; });
  const ord = [...D.lots].sort((a,b)=>b.live-a.live); ord.forEach((l,i)=>l.rank=i+1);
  CRIT.forEach(c=>{ const el=$('sv_'+c); if(el) el.textContent = Math.round(w[c]*100)+'%'; });
}
function scenarioRobust(){ return Object.keys(D.scenari)[0]; }

// ---------- layer disponibili
function buildLayerSelect(){
  const sel = $('layer'); const opts = [];
  opts.push(['s_live','Idoneità (pesi correnti)']);
  opts.push(['cluster','Cluster K-Means']);
  ['PC1','PC2','PC3'].forEach(k => PCOLS.has(k) && opts.push([k, 'Componente '+k]));
  Object.keys(D.scenari).forEach(s => { opts.push(['s_'+s,'Idoneità: scenario '+s]); opts.push(['robust_'+s,'Robustezza pesi: '+s]); });
  opts.push(['pareto','Frontiera di Pareto']);
  const skip = /^(cluster|pareto|valido|PC\d|s_|robust_|crit_|c_|h3)/;
  [...PCOLS].filter(k => !skip.test(k)).sort().forEach(k => opts.push([k, k]));
  [...PCOLS].filter(k => /^crit_/.test(k)).forEach(k => opts.push([k,'Criterio normalizzato: '+k.slice(5)]));
  sel.innerHTML = opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
  sel.onchange = () => { st.layer = sel.value; draw(); };
}
function val(c, layer){ return layer==='s_live' ? c.live : c.p[layer]; }

// ---------- UI
function buildUI(){
  buildLayerSelect();
  $('sliders').innerHTML = CRIT.map(c => `<div class="sl"><span>${CRIT_LABEL[c]||c}</span><input type="range" min="0" max="100" value="25" id="w_${c}"><span id="sv_${c}">25%</span></div>`).join('');
  CRIT.forEach(c => $('w_'+c).oninput = e => { W[c] = +e.target.value/100; recompute(); fillLots(); draw(); });
  $('presets').innerHTML = Object.keys(D.scenari).map(s => `<button data-s="${s}">${s}</button>`).join('');
  document.querySelectorAll('#presets button').forEach(b => b.onclick = () => { const sc = D.scenari[b.dataset.s]; CRIT.forEach(c => { W[c] = sc[c]||0; $('w_'+c).value = Math.round(W[c]*100); }); $('wnote').textContent = 'Preset “'+b.dataset.s+'”: pesi iniziali dichiarati in config/pipeline.yaml. Sono parametri, non risultati.'; recompute(); fillLots(); draw(); });
  $('topq').oninput = e => { st.topq = +e.target.value/100; $('topqv').textContent = e.target.value+'%'; recompute(); draw(); };
  $('useConstr').onchange = e => { st.useConstr = e.target.checked; recompute(); fillLots(); draw(); };
  $('showPareto').onchange = e => { st.pareto = e.target.checked; draw(); };
  $('tilt').oninput = e => { st.tilt = +e.target.value; $('tiltv').textContent = e.target.value+'°'; draw(); };
  $('zscale').oninput = e => { st.z = +e.target.value; $('zv').textContent = e.target.value; draw(); };
  $('b2d').onclick = () => { $('tilt').value=0; st.tilt=0; $('tiltv').textContent='0°'; $('b2d').classList.add('on'); $('b3d').classList.remove('on'); draw(); };
  $('b3d').onclick = () => { $('tilt').value=55; st.tilt=55; $('tiltv').textContent='55°'; $('b3d').classList.add('on'); $('b2d').classList.remove('on'); draw(); };
  $('reset').onclick = () => { fit(); draw(); };
  let lh = `<label class="chk"><input type="checkbox" id="sh_boundary" checked> Confine</label><label class="chk"><input type="checkbox" id="sh_roads" checked> Strade principali</label><label class="chk"><input type="checkbox" id="sh_lots" checked> Lotti candidati</label>`;
  Object.keys(pois).forEach(k => lh += `<label class="chk"><input type="checkbox" id="sp_${k}"> <i style="background:${POI_COL[k]||'#ccc'}"></i>${k}</label>`);
  $('layers').innerHTML = lh;
  ['boundary','roads','lots'].forEach(k => $('sh_'+k).onchange = e => { st.show[k]=e.target.checked; draw(); });
  Object.keys(pois).forEach(k => $('sp_'+k).onchange = e => { st.show.poi[k]=e.target.checked; draw(); });

  const m = D.manifest;
  $('banner').innerHTML = (m.synthetic ? '<span class="tag warn">DATI SINTETICI DI COLLAUDO — non rappresentano Milano</span> ' : '<span class="tag">dati reali (vedi provenienza)</span> ')
    + `<span class="tag">${D.cells.length} celle</span> <span class="tag">${D.lots.length} lotti candidati</span> <span class="tag">${(m.avvisi||[]).length} avvisi</span> <span class="tag">generato ${m.creato_il||''}</span>`;

  const cr = D.cluster_report;
  const fm = x => (100*x).toFixed(1)+'%';
  $('stats').innerHTML = `<table class="kv small">
    <tr><td>Varianza spiegata PC1/PC2/PC3</td><td>${cr.varianza_spiegata.map(fm).join(' · ')}</td></tr>
    <tr><td>Cumulata</td><td>${fm(cr.varianza_cumulata)}</td></tr>
    <tr><td>K scelto${cr.k_forzato?' (forzato)':' (silhouette)'}</td><td>${cr.k_scelto}</td></tr>
    <tr><td>Silhouette per K</td><td>${cr.selezione_k.map(r=>r.k+':'+r.silhouette.toFixed(2)).join(' ')}</td></tr>
    <tr><td>Stabilità (ARI bootstrap) media / min</td><td>${cr.stabilita_bootstrap_ari_media.toFixed(2)} / ${cr.stabilita_bootstrap_ari_min.toFixed(2)}</td></tr></table>
    <details><summary>Tratti distintivi dei cluster</summary>${Object.entries(cr.tratti_distintivi).map(([k,v])=>`<p class="small"><b style="color:${CAT[k%CAT.length]}">Cluster ${k}</b> (${v.n_celle} celle)<br>alto: ${v.alto.join(', ')||'—'}<br>basso: ${v.basso.join(', ')||'—'}</p>`).join('')}<p class="note small">${cr.nota}</p><p class="note small">${cr.nota_k||''}</p></details>
    <details><summary>Caricamenti PCA</summary><table class="small"><tr><th></th>${Object.keys(cr.caricamenti).map(k=>`<th>${k}</th>`).join('')}</tr>${cr.feature_usate.map(f=>`<tr><td>${f}</td>${Object.keys(cr.caricamenti).map(k=>`<td class="mono">${cr.caricamenti[k][f].toFixed(2)}</td>`).join('')}</tr>`).join('')}</table></details>`;

  const fonti = Object.entries(m.fonti).map(([k,v]) => `<tr><td>${k}</td><td>${v.presente===false?'<span style="color:var(--bad)">assente</span>':'presente'}</td></tr>`).join('');
  $('prov').innerHTML = `<table class="kv small">${fonti}</table>
    <p class="small">Origine lotti: ${m.origine_lotti||'—'}</p>
    ${(m.vincoli_non_applicati||[]).length?`<p class="small" style="color:var(--accent)">Vincoli NON applicati (dato assente): ${m.vincoli_non_applicati.join(', ')}</p>`:''}
    <details><summary>Avvisi (${(m.avvisi||[]).length})</summary><ul class="small">${(m.avvisi||[]).map(a=>`<li>${a}</li>`).join('')}</ul></details>`;
}

function fillLots(){
  const sc = scenarioRobust(); const top = [...D.lots].sort((a,b)=>a.rank-b.rank).slice(0,40);
  $('lotnote').textContent = D.lots.length ? 'Il punteggio usa i pesi dei cursori. “Rob.” = robustezza dello scenario “'+sc+'” (quota di perturbazioni dei pesi in cui il lotto resta nei primi N). Ipotesi da verificare: proprietà, bonifica, indici reali.' : 'Nessun lotto candidato.';
  $('lots').querySelector('tbody').innerHTML = top.map(l => `<tr class="lot ${st.selLot===l.id?'sel':''}" data-id="${l.id}"><td>${l.rank}</td><td>${l.id}</td><td class="mono">${Math.round(l.p.area_m2).toLocaleString('it')}</td><td class="mono">${l.live.toFixed(2)}</td><td class="mono">${l.p['robust_'+sc]==null?'—':Math.round(l.p['robust_'+sc]*100)+'%'}</td></tr>`).join('');
  document.querySelectorAll('tr.lot').forEach(tr => tr.onclick = () => selectLot(tr.dataset.id));
}
function selectLot(id){ st.selLot=id; st.sel=null; const l=D.lots.find(x=>x.id===id); if(l){ st.ox=-l.cx*st.scale; st.oy=l.cy*st.scale; inspectLot(l);} fillLots(); draw(); }
const fmt = (k,v) => v==null ? '—' : (typeof v==='number' ? (Math.abs(v)>=1000? Math.round(v).toLocaleString('it') : (Number.isInteger(v)? v : v.toFixed(3))) : v);
function inspect(c){ $('insp').innerHTML = `<div class="small mono">${c.id}</div><table class="kv small">${Object.entries(c.p).map(([k,v])=>`<tr><td>${k}</td><td>${fmt(k,v)}</td></tr>`).join('')}<tr><td>idoneità (pesi correnti)</td><td>${c.live.toFixed(3)}</td></tr></table>`; }
function inspectLot(l){ $('insp').innerHTML = `<div class="small mono">Lotto ${l.id} — posizione ${l.rank}</div><table class="kv small">${Object.entries(l.p).map(([k,v])=>`<tr><td>${k}</td><td>${fmt(k,v)}</td></tr>`).join('')}<tr><td>punteggio (pesi correnti)</td><td>${l.live.toFixed(3)}</td></tr></table>`; }

// ---------- disegno
const cv = $('cv'), ctx = cv.getContext('2d');
function resize(){ const r = cv.getBoundingClientRect(), d = window.devicePixelRatio||1; cv.width = r.width*d; cv.height = r.height*d; ctx.setTransform(d,0,0,d,0,0); }
function fit(){ const r = cv.getBoundingClientRect(); st.scale = Math.min(r.width/(maxx-minx), r.height/(maxy-miny))*0.9; st.ox = -(minx+maxx)/2*st.scale; st.oy = (miny+maxy)/2*st.scale; }
function S(x,y,z){ const r = cv.getBoundingClientRect(), t = st.tilt*Math.PI/180; return [r.width/2 + x*st.scale + st.ox, r.height/2 - y*st.scale*Math.cos(t) + st.oy*Math.cos(t) - (z||0)*Math.sin(t)]; }

function legendFor(layer){
  const L = $('legend'); $('lcat').innerHTML=''; $('bar').style.display='block';
  if(layer==='cluster'){ $('bar').style.display='none'; $('ltitle').textContent='Cluster K-Means'; $('lmin').textContent=''; $('lmax').textContent='';
    $('lcat').innerHTML = [...new Set(D.cells.map(c=>c.p.cluster))].sort().map(k=>`<div><i style="display:inline-block;width:10px;height:10px;background:${CAT[k%CAT.length]};margin-right:6px"></i>cluster ${k}</div>`).join(''); return; }
  if(layer==='pareto'){ $('bar').style.display='none'; $('ltitle').textContent='Pareto-ottimali (sui 4 criteri)'; $('lcat').innerHTML='<div><i style="display:inline-block;width:10px;height:10px;background:#ffb454;margin-right:6px"></i>non dominata</div><div><i style="display:inline-block;width:10px;height:10px;background:#31404c;margin-right:6px"></i>dominata o vincolata</div>'; $('lmin').textContent=''; $('lmax').textContent=''; return; }
  $('ltitle').textContent = layer==='s_live' ? 'Idoneità (pesi correnti), 0–1' : layer;
  $('bar').style.background = `linear-gradient(90deg,${RAMP.join(',')})`; $('lmin').textContent = fmt('',range.min); $('lmax').textContent = fmt('',range.max);
}
let range = {min:0,max:1};
function computeRange(layer){ const v = D.cells.map(c=>val(c,layer)).filter(x=>x!=null && isFinite(x)).sort((a,b)=>a-b); if(!v.length){ range={min:0,max:1}; return; } range = {min:v[Math.floor(v.length*0.01)], max:v[Math.min(v.length-1,Math.floor(v.length*0.99))]}; if(range.max<=range.min) range.max=range.min+1e-9; }
function colorOf(c){
  const l = st.layer;
  if(l==='cluster') return CAT[c.p.cluster%CAT.length];
  if(l==='pareto') return c.p.pareto===1 && c.ok ? '#ffb454' : '#31404c';
  const v = val(c,l); if(v==null) return '#222'; return ramp((v-range.min)/(range.max-range.min));
}
function heightOf(c){ if(st.tilt===0) return 0; const l = st.layer; if(l==='cluster'||l==='pareto') return (c.live||0)*st.z*1.2; const v = val(c,l); if(v==null) return 0; return Math.max(0,(v-range.min)/(range.max-range.min))*st.z*1.2; }
function draw(){
  resize(); const r = cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
  computeRange(st.layer); legendFor(st.layer);
  const path = (pts,z) => { ctx.beginPath(); pts.forEach((p,i)=>{ const q=S(p[0],p[1],z); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); };
  const cells = [...D.cells].sort((a,b)=>b.cy-a.cy);
  for(const c of cells){
    const z = heightOf(c); c.z = z;
    if(st.tilt>0 && z>0){   // facce laterali visibili (rivolte a sud)
      const dark = shade(colorOf(c), .55);
      for(let i=0;i<c.m.length-1;i++){ const a=c.m[i], b=c.m[i+1]; const dx=b[0]-a[0]; const facing = c.ccw ? dx>0 : dx<0; if(!facing) continue;
        ctx.beginPath(); [S(a[0],a[1],0),S(b[0],b[1],0),S(b[0],b[1],z),S(a[0],a[1],z)].forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fillStyle=dark; ctx.fill(); }
    }
    path(c.m,z); ctx.closePath(); ctx.fillStyle = colorOf(c); ctx.fill();
    const top = st.layer==='s_live' ? false : false;
    if(c.ok && c.live>=st.thr && st.topq>0){ ctx.lineWidth=1.6; ctx.strokeStyle='#ffffff'; ctx.stroke(); }
    else { ctx.lineWidth=.5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke(); }
    if(st.pareto && c.p.pareto===1 && c.ok){ ctx.lineWidth=2; ctx.strokeStyle='#ffb454'; ctx.stroke(); }
    if(st.sel===c.id){ ctx.lineWidth=3; ctx.strokeStyle='#4cc9f0'; path(c.m,z); ctx.closePath(); ctx.stroke(); }
  }
  if(st.show.boundary){ ctx.lineWidth=1.5; ctx.strokeStyle='rgba(230,237,243,.7)'; bnd.forEach(b=>{ path(b,0); ctx.closePath(); ctx.stroke(); }); }
  if(st.show.roads){ ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.28)'; roads.forEach(rd=>{ path(rd,0); ctx.stroke(); }); }
  for(const [k,pts] of Object.entries(pois)){ if(!st.show.poi[k]) continue; ctx.fillStyle=POI_COL[k]||'#ccc'; pts.forEach(p=>{ const q=S(p[0],p[1],0); ctx.fillRect(q[0]-1.5,q[1]-1.5,3,3); }); }
  if(st.show.lots){ D.lots.forEach(l=>{ const sel = st.selLot===l.id, top = l.rank<=25; ctx.lineWidth = sel?3:(top?2:1); ctx.strokeStyle = sel?'#4cc9f0':(top?'#ff4d6d':'rgba(255,77,109,.55)'); ctx.fillStyle = top?'rgba(255,77,109,.35)':'rgba(255,77,109,.12)';
      l.m.forEach(ring=>{ path(ring,0); ctx.closePath(); ctx.fill(); ctx.stroke(); });
      if(top||sel){ const q=S(l.cx,l.cy,0); ctx.fillStyle='#fff'; ctx.font='bold 11px system-ui'; ctx.fillText(l.rank, q[0]+3, q[1]-3);} }); }
}
function shade(col,f){ const m = col.match(/\d+/g); if(m && col.startsWith('rgb')) return `rgb(${Math.round(m[0]*f)},${Math.round(m[1]*f)},${Math.round(m[2]*f)})`; const h=hex(col); return `rgb(${Math.round(h[0]*f)},${Math.round(h[1]*f)},${Math.round(h[2]*f)})`; }

// ---------- interazione
function pick(mx,my){
  let best=null;
  for(const c of [...D.cells].sort((a,b)=>a.cy-b.cy)){ const z=c.z||0; const pts=c.m.map(p=>S(p[0],p[1],z)); if(inside(mx,my,pts)) best=c; }
  return best;
}
function inside(x,y,pts){ let ins=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ if(((pts[i][1]>y)!==(pts[j][1]>y)) && (x < (pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0])) ins=!ins; } return ins; }
let drag=null, moved=false;
cv.addEventListener('mousedown', e => { drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy}; moved=false; });
window.addEventListener('mouseup', e => { if(drag && !moved){ const r=cv.getBoundingClientRect(); const c = pick(e.clientX-r.left, e.clientY-r.top); if(c){ st.sel=c.id; st.selLot=null; inspect(c); fillLots(); draw(); } } drag=null; });
window.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; st.ox=drag.ox+dx; const t=st.tilt*Math.PI/180; st.oy=drag.oy+dy/Math.cos(t); draw(); return; }
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){ $('tip').style.display='none'; return; }
  const c = pick(e.clientX-r.left, e.clientY-r.top); const tip=$('tip');
  if(c){ tip.style.display='block'; tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top+12)+'px'; const v=val(c,st.layer); tip.textContent = c.id+'\n'+st.layer+': '+fmt('',v)+'\nidoneità: '+c.live.toFixed(2); } else tip.style.display='none';
});
cv.addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY<0?1.15:1/1.15; const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left-r.width/2, my=e.clientY-r.top-r.height/2; st.ox = mx-(mx-st.ox)*f; st.oy = my-(my-st.oy)*f; st.scale*=f; draw(); }, {passive:false});
window.addEventListener('resize', draw);

buildUI(); resize(); fit(); recompute(); fillLots(); draw();
window.__hub = {D, st};
})();
</script>
